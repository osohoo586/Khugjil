{% extends "base.html" %}
{% block title %}Баталгаажуулалт{% endblock %}
{% block content %}
<h1>Дахин баталгаажуулна уу</h1>
<p>Энэ үйлдэл эмзэг мэдээлэлтэй холбоотой тул баталгаажуулах кодоо оруулна уу.</p>
{% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/stepup" class="stack narrow">
  {{ ui.csrf() }}
  <input type="hidden" name="next" value="{{ next }}">
  <label class="field"><span class="field-label">6 оронтой код</span><input name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="20"></label>
  <button class="btn btn-primary" type="submit">Баталгаажуулах</button>
</form>
{% endblock %}
