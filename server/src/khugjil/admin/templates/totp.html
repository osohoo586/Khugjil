{% extends "base_public.html" %}
{% block title %}Баталгаажуулах код{% endblock %}
{% block content %}
<h1>Баталгаажуулах код</h1>
{% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login/totp" class="stack">
  <label class="field"><span class="field-label">Апп дээрх 6 оронтой код</span>
    <input name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="20" class="tabular"></label>
  <button class="btn btn-primary" type="submit">Нэвтрэх</button>
</form>
<p class="muted small">Утсаа алдсан бол хадгалсан нөөц кодын аль нэгийг (жишээ нь ABCDE-12345) оруулна уу.</p>
{% endblock %}
