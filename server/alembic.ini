[alembic]
script_location = src/khugjil/db/migrations
# The URL comes from KHJ_MIGRATION_DATABASE_URL (owner role), never from this file.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
