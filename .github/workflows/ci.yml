name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-not-secret
          POSTGRES_DB: khugjil_test
        ports: ["55442:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56389:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cd server && uv sync --locked
      - run: make lint
      - run: make typecheck
      - run: make security
      - run: make coverage

  cashier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd cashier && npm ci
      - run: make cashier-check
      - run: cd cf-worker && npm test

  e2e:
    # Screenshot tests (SPEC §8.5) against the committed *-linux.png baselines. They are rendered in
    # the same image and on the same CPU architecture (arm64) that generated them (e2e/README.md).
    runs-on: ubuntu-24.04-arm
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cd server && uv sync --locked
      - run: cd cashier && npm ci
      - run: cd e2e && npm ci
      - run: cd e2e && npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/test-results
          retention-days: 7

  agent:
    # Phase 2 desktop agent (PLAN-PHASE2 §7). Built and tested on Windows; the installer is unsigned
    # and has no updater artifacts here (releases: agent-release.yml).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: rustup toolchain install stable --profile minimal -c clippy -c rustfmt && rustup default stable
      - run: node agent/scripts/check-capabilities.mjs
      - run: cd cashier && npm ci && npm run build:agent
      - run: cd agent && npm ci
      - run: cd agent/src-tauri && cargo fmt --check
      - run: cd agent/src-tauri && cargo clippy --locked --all-targets -- -D warnings
      - run: cd agent/src-tauri && cargo test --locked
      - run: cd agent && npx tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: khugjil-agent-unsigned
          path: agent/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  agent-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install --locked cargo-audit
      - run: cd agent/src-tauri && cargo audit --deny warnings
      - run: cd agent && npm ci && npm audit --audit-level=moderate
