# Copy to /etc/fail2ban/jail.d/ and the filters to /etc/fail2ban/filter.d/.
# Containers log JSON to journald with the tag khugjil-<service>.
[sshd]
enabled = true

[khugjil-smtp]
enabled      = true
backend      = systemd
journalmatch = SYSLOG_IDENTIFIER=khugjil-smtp-1
filter       = khugjil-smtp
port         = 25
maxretry     = 10
findtime     = 10m
bantime      = 1h

[khugjil-web]
enabled      = true
backend      = systemd
journalmatch = SYSLOG_IDENTIFIER=khugjil-api-1
filter       = khugjil-web
port         = 443
maxretry     = 10
findtime     = 10m
bantime      = 1h
